[build]
builder = "NIXPACKS"
# Frontend ships on Cloudflare Pages at https://olicomm.healthexps.com (Netlify kept as a fallback).
# Railway only runs the API (node server.js).
# Skipping CRA build avoids false failures from frontend webpack/eslint.
buildCommand = "echo 'Skipping frontend build — Cloudflare Pages (fallback: Netlify) hosts the UI'"

[deploy]
startCommand = "node server.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
